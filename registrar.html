<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar</title>
    <link rel="stylesheet" href="css/semantic.min.css">
</head>

<body>
    <form action="index.html" class="ui form">
        <div class="ui center aligned header">
            <h1>Registrar-se</h1>
        </div>
        <div class="ui middle aligned center aligned grid">
            <fieldset style="width: fit-content;">
                <legend>Registrar-se</legend>
                <p>
                    <label for="idNomeRegistro">Usuário:</label>
                    <input type="text" name="usuario" id="idNomeRegistro" placeholder="Digite seu usuário.." required>
                </p>

                <p>
                    <label for="idEmailRegistro">E-mail:</label>
                    <input type="email" name="email" id="idEmailRegistro" placeholder="Digite seu e-mail..." required>
                </p>

                <p>
                    <label for="">Sexo:</label>
                    <input type="radio" name="sexo" id="idMasc"><label for="idMasc">Masculino</label>
                    <input type="radio" name="sexo" id="idFem"><label for="idFem">Feminino</label>
                    <input type="radio" name="sexo" id="idOutro"><label for="idOutro">Outro</label>
                </p>

                <p>
                    <label for="idSenhaRegistro">Senha:</label>
                    <input type="password" name="senha" id="idSenhaRegistro" placeholder="Digite sua senha..." required
                        pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                        title="Deve conter pelo menos um número, uma letra maiúscula, uma letra minúscula e 8 caracteres."><br><br>
                    <label for="idConfirmarSenha">Confirmar senha:</label>
                    <input type="password" name="senha" id="idConfirmarSenha"
                        placeholder="Digite novamente sua senha..." required
                        pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                        title="Deve conter pelo menos um número, uma letra maiúscula, uma letra minúscula e 8 caracteres.">
                </p>

                <div class="ui toggle checkbox">
                    <input type="checkbox" name="public">
                    <label>Subscribe to weekly newsletter</label>
                </div>

                <p>
                <div class="ui checkbox">
                    <input type="checkbox" tabindex="0">
                    <label>I agree to the Terms and Conditions</label>
                </div>
                </p>

                <p>
                    <input type="submit" value="Registrar-se" class="ui primary button">
                    <input type="reset" value="Limpar" class="ui button">
                </p>
            </fieldset>
        </div>
    </form>
</body>

</html>
