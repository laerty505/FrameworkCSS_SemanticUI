<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/semantic.min.css">
</head>

<body>
    <div class="ui center aligned header">
        <h1>Login</h1>
    </div>
    <div class="ui middle aligned center aligned grid">
        <form action="tela_principal.html" class="ui form">
            <fieldset style="width: fit-content;">
                <legend>Login</legend>
                <p>
                    <label for="idNomeLogin">Usuário:</label>
                <div class="ui input focus">
                    <input type="text" name="usuario" placeholder="Digite seu usuário..." id="idNomeLogin" required>
                </div>
                <br><br>
                </p>

                <p>
                    <label for="idSenhaLogin">Senha:</label>
                <div class="ui input focus">
                    <input type="password" name="senha" placeholder="Digite sua senha..." id="idSenhaLogin" required
                        pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                        title="Deve conter pelo menos um número, uma letra maiúscula, uma letra minúscula e 8 caracteres.">
                </div>
                <br><br>
                </p>

                <a href="registrar.html">Registrar</a><br><br>

                <a href="recuper_senha.html">Recuperar Senha</a><br><br>

                <input type="submit" value="Entrar" class="ui primary button">
            </fieldset>
        </form>
    </div>

    
</body>

</html>
